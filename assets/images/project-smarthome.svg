<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bgH" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101a2e"/>
      <stop offset="1" stop-color="#070b18"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bgH)"/>
  <g opacity="0.15" stroke="#2dd4f5">
    <path d="M0 60H800M0 140H800M0 220H800M0 300H800M0 380H800M0 460H800"/>
  </g>
  <!-- house -->
  <polygon points="400,110 560,220 560,380 240,380 240,220" fill="#0f1b3a" stroke="#2dd4f5" stroke-width="2"/>
  <rect x="370" y="290" width="60" height="90" fill="#050810" stroke="#3a4a78"/>
  <rect x="270" y="240" width="55" height="55" fill="#050810" stroke="#3a4a78"/>
  <rect x="475" y="240" width="55" height="55" fill="#050810" stroke="#3a4a78"/>
  <!-- PIR / sensor node -->
  <circle cx="620" cy="200" r="14" fill="#ffb454"/>
  <path d="M400 380 L620 200" stroke="#3a4a78" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="655" y="205" font-family="'JetBrains Mono', monospace" font-size="12" fill="#ffb454">PIR</text>
  <!-- gas sensor -->
  <circle cx="180" cy="230" r="14" fill="#ff5d6c"/>
  <path d="M240 260 L180 230" stroke="#3a4a78" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="120" y="225" font-family="'JetBrains Mono', monospace" font-size="12" fill="#ff5d6c">MQ-GAS</text>
  <!-- dht -->
  <circle cx="180" cy="340" r="14" fill="#34e0a1"/>
  <path d="M240 330 L180 340" stroke="#3a4a78" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="105" y="345" font-family="'JetBrains Mono', monospace" font-size="12" fill="#34e0a1">DHT11</text>

  <text x="400" y="440" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="13" letter-spacing="2" fill="#8f9ac2">ESP32/ESP8266 · WI-FI · RELAY · BUZZER</text>
</svg>
